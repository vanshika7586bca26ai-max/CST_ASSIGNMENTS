<!DOCTYPE html>
<html>
<head>
    <title>Interactive Restaurant Menu</title>
</head>

<body bgcolor="lightyellow">

    <h1 align="center">Interactive Restaurant Menu</h1>

    <h3 align="center">Click on the food items to know more!</h3>

    <center>
        <img src="./image_restaurant/restaurant.jpeg"
             alt="Restaurant Food"
             usemap="#foodmap"
            >
    </center>

    <map name="foodmap">

        <!-- Circle 1: Pizza -->
        <area shape="circle"
              coords="534,786,200"
              href="https://www.indianhealthyrecipes.com/pizza-recipe-make-pizza/"
              alt="Pizza"
              target="_blank">

        <!-- Circle 2: Burger -->
        <area shape="circle"
              coords="1145,234,112"
              href="https://www.indianhealthyrecipes.com/veg-burger-recipe-veggie-burger-recipe/"
              alt="Burger"
              target="_blank">

        <!-- Rectangle 1: Menu Card -->
           <area shape="rect"
              coords="713,603,1068,935"
              href="https://en.wikipedia.org/wiki/Menu"
              alt="Sandwich"
              target="_blank">

         <!-- Polygon 1: Sandwitch -->
             <area shape="poly"
              coords="680,0,986,110,880,385,510,240"
              href="https://en.wikipedia.org/wiki/Sandwich"
              alt="Sandwitch"
              target="_blank">
              

         <!-- Rectangle 1: French Fries -->
           <area shape="rect"
              coords="220,320,530,570"
              href="https://www.indianhealthyrecipes.com/french-fries/"
              alt="French fries"
              target="_blank"> 

        <!-- Polygon 2: cake -->
            <area shape="poly"
              coords="570,390,650,410,710,460,670,530,590,500"
              href="https://www.indianhealthyrecipes.com/chocolate-cake-recipe/"
              alt="Ice Cream"
              target="_blank">



    </map>

    <h2 align="center">Our Menu</h2>

    <center>
        <p>Pizza | Burger | Sandwich</p>
        <p>French Fries | Cake | Ice Cream</p>
    </center>

    <h3 align="center">Thank You for Visiting!</h3>

</body>
</html>
