<!DOCTYPE html>
<html>

    <title>Explore the World - Travel Agency</title>

<!-- Task 2 & 8: Horizontal rows with specific heights and attributes configured -->
<frameset rows="20%,65%,15%" border="1" frameborder="1" cellspacing="0">
    
    <!-- Task 5: Header Frame -->
    <frame src="header.html" name="header" scrolling="no" noresize="noresize" marginwidth="10" marginheight="10">
    
    <!-- Task 3 & 5: Main Content section split into 3 vertical columns -->
    <frameset cols="25%,45%,30%">
        <frame src="navigation.html" name="navigation" scrolling="auto" noresize="noresize" marginwidth="10" marginheight="10">
        <frame src="home.html" name="main_content" scrolling="auto" noresize="noresize" marginwidth="15" marginheight="15">
        <frame src="packages.html" name="packages" scrolling="auto" noresize="noresize" marginwidth="10" marginheight="10">
    </frameset>
    
    <!-- Task 5: Footer Frame -->
    <frame src="footer.html" name="footer" scrolling="no" noresize="noresize" marginwidth="10" marginheight="10">

</frameset>
