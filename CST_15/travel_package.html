<!DOCTYPE html>
<html>
<head>
    <title>Travel Packages</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fdfefe; padding: 10px; }
        h2 { color: #2c3e50; font-size: 18px; border-bottom: 2px solid #34495e; }
        .package { background: #f2f4f4; border: 1px solid #d5dbdb; padding: 8px; margin-bottom: 10px; border-radius: 4px; }
        .pkg-title { font-weight: bold; color: #d35400; }
    </style>
</head>
<body>
    <h2>Travel Packages</h2>
    
    <!-- Task 9: Displaying Budget, Family, and Adventure Packages -->
    <div class="package">
        <div class="pkg-title">BUDGET PACKAGES</div>
        <p style="margin:4px 0 0 0; font-size:13px;">Affordable stays and essential sightseeing options for smart travelers.</p>
    </div>
    
    <div class="package">
        <div class="pkg-title">FAMILY PACKAGES</div>
        <p style="margin:4px 0 0 0; font-size:13px;">Kid-friendly itineraries, comfortable resorts, and inclusive guided tours.</p>
    </div>
    
    <div class="package">
        <div class="pkg-title">ADVENTURE PACKAGES</div>
        <p style="margin:4px 0 0 0; font-size:13px;">Trekking, water sports, and thrill-seeking paths for brave explorers.</p>
    </div>
</body>
</html>
